# Optional Conda environment. Then install the pinned Iris inference package
# with --no-deps as shown in readme.md. Windows users can use setup-iris.ps1.
name: visual_anagrams_iris
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - -r requirements-iris.txt
